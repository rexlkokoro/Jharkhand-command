version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: jhcmd_postgres
    environment:
      POSTGRES_USER: jhcmd
      POSTGRES_PASSWORD: jhcmd_dev
      POSTGRES_DB: jharkhand_command
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhcmd -d jharkhand_command"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jhcmd_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: jhcmd_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://jhcmd:jhcmd_dev@postgres:5432/jharkhand_command
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: jhcmd_celery_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://jhcmd:jhcmd_dev@postgres:5432/jharkhand_command
      REDIS_URL: redis://redis:6379
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      GOOGLE_GEOCODING_KEY: ${GOOGLE_GEOCODING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: celery -A app.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: jhcmd_celery_beat
    environment:
      DATABASE_URL: postgresql+asyncpg://jhcmd:jhcmd_dev@postgres:5432/jharkhand_command
      REDIS_URL: redis://redis:6379
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      GOOGLE_GEOCODING_KEY: ${GOOGLE_GEOCODING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: celery -A app.celery_app beat --loglevel=info

  mock_simulator:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: jhcmd_mock_simulator
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
    command: python -m app.services.mock_simulator
    profiles:
      - dev

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: jhcmd_web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - api
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
